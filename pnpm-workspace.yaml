minimumReleaseAge: 2880

packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@changesets/cli': ^3.0.3
  '@playwright/test': 1.64.0
  '@types/node': ^26.5.1
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/browser-playwright': 5.0.1
  '@vitest/coverage-v8': 5.0.1
  playwright: 1.64.0
  tsx: ^4.23.13
  typescript: ^6.0.3
  valibot: ^1.5.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs but uses Vite+'s package version.
    vite: '1.0.0'
